name: Image

# Builds and pushes ghcr.io/ianwijma/personal-voice-assistant (linux/amd64). See docs/DEPLOYMENT.md.
#   push to main        -> sha-<7 characters>, main
#   pull request        -> pr-<number>-<full head sha>, only for a PR from this repository with the label "preview"
#   workflow_dispatch   -> the same tags as a push, from main only
# No "latest" tag. No pull_request_target: a fork's code never runs with the package write token.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/ianwijma/personal-voice-assistant

jobs:
  image:
    if: >-
      (github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       contains(github.event.pull_request.labels.*.name, 'preview'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Choose the revision and tags
        id: meta
        env:
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            revision="$PR_HEAD_SHA"
            tags="$IMAGE:pr-${PR_NUMBER}-${revision}"
          else
            revision="$GITHUB_SHA"
            tags="$IMAGE:sha-${revision:0:7}"$'\n'"$IMAGE:main"
          fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The PR head, not the merge commit.
          ref: ${{ steps.meta.outputs.revision }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.revision }}
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
            org.opencontainers.image.title=personal-voice-assistant
            org.opencontainers.image.description=Personal voice assistant, serve mode (web UI and WebSocket on one port)
