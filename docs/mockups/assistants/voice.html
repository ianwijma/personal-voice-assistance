<!doctype html>
<!-- Design reference, 2026-11-16. The built admin and voice pages follow this mock-up but may differ from it; docs/ASSISTANTS.md section 7.3 ("Where this design differs from the mock-ups") and "Differences in the built UI" list the differences. The code and that list win. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice page assistants</title>
<meta name="description" content="Clickable mock-up: the voice page with several assistants on one device.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* ---- Product tokens (apps/web/src/app/globals.css), dark by default */
:root {
  --color-bg: oklch(0.165 0.006 110);
  --color-surface: oklch(0.205 0.007 110);
  --color-surface-2: oklch(0.245 0.008 110);
  --color-line: oklch(0.32 0.008 110);
  --color-ink: oklch(0.93 0.015 95);
  --color-ink-muted: oklch(0.70 0.014 95);
  --color-ink-faint: oklch(0.64 0.010 95);
  --color-voice: oklch(0.80 0.140 75);
  --color-voice-soft: oklch(0.80 0.140 75 / 0.16);
  --color-you: oklch(0.83 0.090 180);
  --color-you-soft: oklch(0.83 0.090 180 / 0.16);
  --color-ok: oklch(0.78 0.110 150);
  --color-warn: oklch(0.80 0.120 55);
  --color-danger: oklch(0.70 0.170 28);
  --font-sans: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", monospace;
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 16px;
  --shadow-panel: 0 16px 48px -16px oklch(0 0 0 / 0.65);
  --ease-out: cubic-bezier(0.2, 0.8, 0.2, 1);
}
@media (prefers-color-scheme: light) {
  :root {
    --color-bg: oklch(0.970 0.008 95);
    --color-surface: oklch(0.995 0.004 95);
    --color-surface-2: oklch(0.940 0.008 95);
    --color-line: oklch(0.870 0.010 95);
    --color-ink: oklch(0.220 0.010 110);
    --color-ink-muted: oklch(0.450 0.012 110);
    --color-ink-faint: oklch(0.510 0.010 110);
    --color-voice: oklch(0.520 0.150 60);
    --color-voice-soft: oklch(0.620 0.150 60 / 0.14);
    --color-you: oklch(0.470 0.090 195);
    --color-you-soft: oklch(0.550 0.090 195 / 0.10);
    --color-ok: oklch(0.500 0.110 150);
    --color-warn: oklch(0.520 0.120 50);
    --color-danger: oklch(0.530 0.190 28);
    --shadow-panel: 0 16px 48px -20px oklch(0.3 0.02 95 / 0.35);
  }
}
html { color-scheme: dark; -webkit-text-size-adjust: 100%; }
@media (prefers-color-scheme: light) { html { color-scheme: light; } }
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--color-bg); color: var(--color-ink);
  font-family: var(--font-sans); font-size: 15px; line-height: 1.5; overflow: hidden;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  display: flex; flex-direction: column;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
::selection { background: var(--color-you-soft); }
:focus-visible { outline: 2px solid var(--color-you); outline-offset: 2px; }
.label { font-family: var(--font-mono); font-size: 11px; line-height: 16px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 500; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
.scrollbar-quiet { scrollbar-width: thin; scrollbar-color: var(--color-line) transparent; }
@keyframes pva-fade-in { from { opacity: 0 } to { opacity: 1 } }
@keyframes pva-rise { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
@keyframes pva-drop { from { opacity: 0; transform: translateY(-6px) } to { opacity: 1; transform: none } }
@keyframes pva-slide-in { from { transform: translateX(24px); opacity: 0 } to { transform: none; opacity: 1 } }
@keyframes pva-sheet-up { from { transform: translateY(24px); opacity: 0 } to { transform: none; opacity: 1 } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; }
}

/* ============ Mock-up controls: deliberately not product styling (dashed, no accents) ============ */
.mock {
  flex-shrink: 0; margin: 8px 8px 0; padding: 8px 10px; border: 1.5px dashed var(--color-ink-faint); border-radius: 10px;
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; font: 12px/1.3 var(--font-sans); color: var(--color-ink-muted);
}
.mock-tag { font-family: var(--font-mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; border: 1px dashed var(--color-ink-faint); border-radius: 4px; padding: 2px 6px; color: var(--color-ink-faint); }
.mock-group { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
.mock-group > .mock-name { margin-right: 4px; color: var(--color-ink-faint); }
.mock button.opt, .mock select, .mock .hide {
  height: 26px; padding: 0 9px; border: 1px dashed var(--color-line); border-radius: 6px; background: transparent; color: var(--color-ink-muted); font-size: 12px;
}
.mock select { padding-right: 6px; }
.mock button.opt:hover, .mock .hide:hover { color: var(--color-ink); border-color: var(--color-ink-faint); }
.mock button.opt[aria-pressed="true"] { border-style: solid; border-color: var(--color-ink-muted); color: var(--color-ink); background: var(--color-surface-2); }
.mock button.opt:disabled { opacity: .4; cursor: not-allowed; }
.mock label.chk { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
.mock .hide { margin-left: auto; }
.mock-follow { border-left: 1px dashed var(--color-line); padding-left: 12px; color: var(--color-ink-muted); font-variant-numeric: tabular-nums; }
.mock-tab { position: fixed; left: 8px; bottom: 8px; z-index: 100; height: 28px; padding: 0 10px; border: 1.5px dashed var(--color-ink-faint); border-radius: 8px; background: var(--color-bg); color: var(--color-ink-muted); font: 12px var(--font-sans); }
body.mock-hidden .mock { display: none; }
body:not(.mock-hidden) .mock-tab { display: none; }

/* The area that holds the page frame */
.viewport { position: relative; flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.frame { position: relative; overflow: hidden; background: var(--color-bg); container-type: size; container-name: pva; }
body.desktop .frame { width: 100%; height: 100%; border-top: 1px solid var(--color-line); margin-top: 8px; }
body.mock-hidden.desktop .frame { margin-top: 0; border-top: 0; }
body.phone .frame { width: 390px; height: 844px; flex-shrink: 0; border: 1px solid var(--color-line); border-radius: 36px; transform-origin: center center; }

/* ============ The voice page (container queries stand in for the product's media queries) ============ */
.app { position: absolute; inset: 0; display: flex; flex-direction: column; }
.topbar { position: relative; z-index: 20; display: flex; height: 56px; flex-shrink: 0; align-items: center; gap: 12px; padding: 0 8px 0 12px; }
@container pva (min-width: 640px) { .topbar { gap: 20px; padding: 0 24px; } }
.tb-left { position: relative; display: flex; min-width: 0; align-items: center; gap: 10px; padding-left: 4px; }
.tdot { width: 8px; height: 8px; border-radius: 9999px; flex-shrink: 0; background: var(--color-ink-faint); transition: background-color 240ms var(--ease-out); }
.tdot.ok { background: var(--color-ok); }
.who-plain { color: var(--color-ink); white-space: nowrap; }
.who-btn {
  display: inline-flex; align-items: center; gap: 6px; height: 44px; margin-left: -8px; padding: 0 8px; border: 0; border-radius: var(--radius-md);
  background: transparent; color: var(--color-ink); white-space: nowrap; transition: background-color 120ms var(--ease-out);
}
.who-btn:hover, .who-btn[aria-expanded="true"] { background: var(--color-surface-2); }
.who-btn svg { color: var(--color-ink-faint); transition: transform 120ms var(--ease-out); }
.who-btn[aria-expanded="true"] svg { transform: rotate(180deg); }
@container pva (min-width: 640px) { .who-btn { height: 32px; } }
.end-btn {
  margin-left: auto; display: inline-flex; height: 44px; align-items: center; gap: 8px; padding: 0 12px; border: 1px solid var(--color-line); border-radius: var(--radius-md);
  background: transparent; color: var(--color-ink-muted); transition: background-color 120ms, color 120ms;
}
.end-btn:hover { background: var(--color-surface-2); color: var(--color-ink); }
.end-btn i { width: 8px; height: 8px; border-radius: 2px; background: currentColor; }
@container pva (min-width: 640px) { .end-btn { margin-left: 0; height: 32px; border-color: transparent; padding: 0 10px; } }
.tb-right { margin-left: auto; display: flex; align-items: center; }
.has-end .tb-right { margin-left: 0; }
@container pva (min-width: 640px) { .has-end .tb-right { margin-left: auto; } }
.icon-btn { display: inline-flex; width: 44px; height: 44px; align-items: center; justify-content: center; border: 0; border-radius: var(--radius-md); background: transparent; color: var(--color-ink-muted); transition: background-color 120ms, color 120ms; }
.icon-btn:hover { background: var(--color-surface-2); color: var(--color-ink); }

/* Assistant menu */
.menu {
  position: absolute; top: calc(100% + 6px); left: -8px; z-index: 50; width: 296px; max-width: calc(100cqw - 24px);
  border: 1px solid var(--color-line); border-radius: var(--radius-lg); background: var(--color-surface); box-shadow: var(--shadow-panel); padding: 4px;
  animation: pva-drop 160ms var(--ease-out);
}
.mi {
  display: flex; width: 100%; min-height: 52px; align-items: flex-start; gap: 10px; padding: 8px 10px; border: 0; border-radius: var(--radius-md);
  background: transparent; text-align: left; transition: background-color 120ms;
}
.mi:hover, .mi:focus-visible { background: var(--color-surface-2); }
.mi:focus-visible { outline-offset: -2px; }
.mi-check { display: inline-flex; width: 16px; height: 20px; flex-shrink: 0; align-items: center; justify-content: center; color: var(--color-you); }
.mi-name { display: block; font-size: 14px; color: var(--color-ink); }
.mi-reach { display: block; font-size: 13px; color: var(--color-ink-muted); }
.mi-sep { height: 1px; margin: 4px 6px; background: color-mix(in oklab, var(--color-line) 60%, transparent); }
.mi-note { margin: 0; padding: 6px 10px 8px 36px; font-size: 12px; color: var(--color-ink-faint); }

/* Stage */
.main { position: relative; flex: 1; min-height: 0; }
.stage {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; overflow-y: auto; overflow-x: hidden; padding-bottom: 128px;
  padding-top: max(12px, min(36cqh - 100px, 50cqh - 200px)); transition: transform 320ms var(--ease-out); scrollbar-width: none;
}
@container pva (min-width: 640px) { .stage { padding-top: max(12px, min(38cqh - 141px, 60cqh - 280px)); } }
@container pva (min-width: 1024px) and (max-width: 1439px) { .chat-open .stage { transform: translateX(-200px); } }
.vis { position: relative; width: calc(100% - 32px); max-width: 720px; flex-shrink: 0; height: clamp(48px, 100cqh - 320px, 160px); }
@container pva (min-width: 640px) { .vis { height: clamp(48px, 100cqh - 320px, 240px); } }
.vis canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.vis .mic-off { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; color: var(--color-ink-faint); }
.is-muted .vis .mic-off { display: flex; }
.state-box { margin-top: 16px; display: grid; min-height: 16px; width: 100%; max-width: calc(100% - 32px); justify-items: center; }
.state { margin: 0; text-align: center; overflow-wrap: anywhere; transition: color 240ms var(--ease-out); }
.tone-voice { color: var(--color-voice); } .tone-you { color: var(--color-you); } .tone-muted { color: var(--color-ink-muted); } .tone-faint { color: var(--color-ink-faint); }
.captions { margin-top: 12px; min-height: 3.2em; width: 100%; max-width: 640px; padding: 0 24px; text-align: center; font-size: 16px; line-height: 1.45; }
@container pva (min-width: 640px) { .captions { font-size: 20px; } }
.captions[hidden] { display: none; }
.captions p { margin: 0; text-wrap: balance; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.cap-you { color: var(--color-you); } .cap-main { color: var(--color-ink); } .cap-next { color: var(--color-ink-muted); }
.below { margin-top: 24px; display: flex; width: 100%; max-width: 560px; flex-direction: column; align-items: center; gap: 16px; padding: 0 16px; }
.below:empty { display: none; }
.hint { margin: 0; text-align: center; font-size: 13px; color: var(--color-ink-faint); animation: pva-fade-in 320ms var(--ease-out); }
.hint kbd { font-family: var(--font-mono); color: var(--color-ink-muted); }
.start-pill {
  display: inline-flex; height: 48px; align-items: center; gap: 12px; padding: 0 28px; border-radius: 9999px;
  border: 1px solid color-mix(in oklab, var(--color-voice) 70%, transparent); background: transparent; color: var(--color-voice);
  transition: background-color 120ms, border-color 120ms;
}
.start-pill:hover { border-color: var(--color-voice); background: var(--color-voice-soft); }
.start-pill .label { font-size: 12px; }
.privacy { max-width: 420px; text-align: center; font-size: 13px; line-height: 1.625; color: var(--color-ink-faint); }
.privacy summary { display: inline-flex; min-height: 44px; align-items: center; gap: 4px; cursor: pointer; list-style: none; }
.privacy summary::-webkit-details-marker { display: none; }
.privacy summary:hover { color: var(--color-ink-muted); }
.privacy summary svg { transition: transform 120ms; }
.privacy[open] summary svg { transform: rotate(90deg); }
.privacy p { margin: 4px 0 0; }
.type-instead { border: 0; background: none; padding: 0; font-size: 13px; color: var(--color-ink-muted); text-decoration: underline; text-decoration-color: var(--color-line); text-underline-offset: 4px; }
.type-instead:hover { color: var(--color-ink); }
@container pva (max-width: 639.98px) { .type-instead { min-height: 44px; } }

/* Dock */
.dock { pointer-events: none; position: absolute; left: 0; right: 0; bottom: 24px; z-index: 10; display: flex; justify-content: center; }
.dock-row { pointer-events: auto; display: flex; align-items: center; gap: 16px; }
@container pva (min-width: 640px) { .dock-row { gap: 12px; } }
.round {
  position: relative; display: inline-flex; width: 56px; height: 56px; align-items: center; justify-content: center; border-radius: 9999px;
  border: 1px solid var(--color-line); background: var(--color-surface); color: var(--color-ink); transition: background-color 120ms, border-color 120ms, color 120ms, opacity 120ms;
}
@container pva (min-width: 640px) { .round { width: 48px; height: 48px; } }
.round:hover { background: var(--color-surface-2); }
.round.muted { background: var(--color-surface-2); color: var(--color-ink-faint); }
.round.stop-off { color: var(--color-ink-faint); opacity: .6; cursor: default; }
.round.stop-off:hover { background: var(--color-surface); }
.round.stop-on { border-color: color-mix(in oklab, var(--color-voice) 60%, transparent); background: var(--color-voice-soft); color: var(--color-voice); }
.round.stop-on:hover { border-color: var(--color-voice); }
.round.pressed { background: var(--color-surface-2); }
.mic-ring { pointer-events: none; position: absolute; inset: -3px; border-radius: 9999px; border: 2px solid var(--color-you); opacity: .9; will-change: transform; }
.more-wrap { position: relative; display: none; }
@container pva (max-width: 639.98px) { .more-wrap { display: block; } }
.dock-menu { position: absolute; bottom: calc(100% + 12px); right: 0; min-width: 192px; width: max-content; border: 1px solid var(--color-line); border-radius: var(--radius-lg); background: var(--color-surface); padding: 4px; box-shadow: var(--shadow-panel); animation: pva-rise 160ms var(--ease-out); }
.dock-menu button { display: flex; width: 100%; min-height: 44px; align-items: center; gap: 10px; padding: 0 12px; border: 0; border-radius: var(--radius-md); background: transparent; font-size: 15px; color: var(--color-ink); text-align: left; }
.dock-menu button:hover { background: var(--color-surface-2); }
.dock-menu svg { color: var(--color-ink-muted); }

/* Panels: shared header */
.scrim { position: absolute; inset: 0; z-index: 30; background: color-mix(in oklab, var(--color-bg) 50%, transparent); animation: pva-fade-in 200ms var(--ease-out); }
.panel-head { display: flex; height: 56px; flex-shrink: 0; align-items: center; gap: 12px; border-bottom: 1px solid var(--color-line); padding: 0 8px 0 20px; }
.panel-head h2 { margin: 0; min-width: 0; color: var(--color-ink-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.conv-wrap { position: relative; flex: 1 1 auto; min-width: 0; }
.conv-btn { display: inline-flex; max-width: 100%; align-items: center; gap: 6px; height: 44px; margin-left: -8px; padding: 0 8px; border: 0; border-radius: var(--radius-md); background: transparent; color: var(--color-ink-muted); white-space: nowrap; transition: background-color 120ms, color 120ms; }
.conv-btn .label { overflow: hidden; text-overflow: ellipsis; }
.conv-btn:hover, .conv-btn[aria-expanded="true"] { background: var(--color-surface-2); color: var(--color-ink); }
.conv-btn svg { flex-shrink: 0; color: var(--color-ink-faint); transition: transform 120ms; }
.conv-btn[aria-expanded="true"] svg { transform: rotate(180deg); }
.conv-menu { top: calc(100% + 2px); }
.panel-head .acts { margin-left: auto; display: flex; flex-shrink: 0; align-items: center; gap: 4px; }
.grab { margin: 8px auto 0; height: 4px; width: 40px; flex-shrink: 0; border-radius: 9999px; background: var(--color-line); }
@container pva (min-width: 640px) { .grab { display: none; } }

/* Chat */
.chat {
  position: absolute; z-index: 40; display: flex; flex-direction: column; overflow: hidden; background: var(--color-surface); box-shadow: var(--shadow-panel);
  left: 0; right: 0; bottom: 0; height: 85cqh; border-top: 1px solid var(--color-line); border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  animation: pva-sheet-up 320ms var(--ease-out);
}
@container pva (min-width: 640px) {
  .chat { left: auto; top: 0; right: 0; height: 100%; width: 400px; border-radius: 0; border-top: 0; border-left: 1px solid var(--color-line); animation-name: pva-slide-in; }
}
@container pva (min-width: 1024px) {
  .chat { top: auto; bottom: 24px; right: 24px; height: min(640px, 100cqh - 120px); border: 1px solid var(--color-line); border-radius: var(--radius-lg); animation: pva-rise 240ms var(--ease-out); }
  .chat-scrim { display: none; }
}
.msgs-wrap { position: relative; min-height: 0; flex: 1; display: flex; flex-direction: column; }
.msgs { min-height: 0; flex: 1; overflow-y: auto; padding: 16px 20px; }
.conv-note { flex-shrink: 0; margin: 0; padding: 10px 20px; font-size: 12px; color: var(--color-ink-faint); border-bottom: 1px solid color-mix(in oklab, var(--color-line) 60%, transparent); }
.divider { margin: 0 0 20px; display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--color-ink-faint); }
.divider::before, .divider::after { content: ""; height: 1px; min-width: 24px; flex: 1; background: var(--color-line); }
.empty-chat { margin: 32px 0 0; text-align: center; font-size: 14px; color: var(--color-ink-faint); }
.turns { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 20px; }
.turn { display: flex; flex-direction: column; gap: 12px; }
.msg { border-left: 2px solid; padding-left: 12px; }
.msg.you { border-color: var(--color-you); }
.msg.voice { border-color: var(--color-voice); }
.msg .who { display: flex; align-items: center; gap: 6px; }
.msg.you .who { color: var(--color-you); }
.msg.voice .who { color: var(--color-voice); }
.msg .who svg { color: var(--color-ink-faint); }
.msg p { margin: 2px 0 0; font-size: 15px; color: var(--color-ink); white-space: pre-wrap; }
.msg.voice p { margin-top: 4px; }
.played { color: var(--color-ink); transition: color 240ms var(--ease-out); } .unplayed { color: var(--color-ink-muted); transition: color 240ms var(--ease-out); }
.tools { margin-top: 6px; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
.toolchip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--color-line); border-radius: var(--radius-sm); padding: 2px 8px; font-family: var(--font-mono); font-size: 12px; color: var(--color-ink); }
.toolchip svg { color: var(--color-ok); }
.composer { flex-shrink: 0; border-top: 1px solid var(--color-line); padding: 10px 12px 12px; }
.comp-box { display: flex; align-items: flex-end; gap: 8px; border: 1px solid var(--color-line); border-radius: var(--radius-md); background: color-mix(in oklab, var(--color-surface-2) 70%, transparent); padding: 4px 4px 4px 12px; }
.comp-box:focus-within { border-color: var(--color-you); outline: 2px solid var(--color-you); outline-offset: 2px; }
.comp-box textarea { min-height: 38px; max-height: 148px; flex: 1; resize: none; border: 0; background: transparent; padding: 8px 0; font-size: 16px; line-height: 22px; color: var(--color-ink); outline: none; }
@container pva (min-width: 640px) { .comp-box textarea { font-size: 15px; } }
.comp-box textarea::placeholder { color: var(--color-ink-faint); }
.send { margin-bottom: 2px; display: inline-flex; width: 44px; height: 44px; flex-shrink: 0; align-items: center; justify-content: center; border: 0; border-radius: var(--radius-md); background: var(--color-ink); color: var(--color-bg); transition: opacity 120ms; }
@container pva (min-width: 640px) { .send { width: 36px; height: 36px; } }
.send:disabled { opacity: .25; cursor: default; }

    list: [{ id: "jeff", phrases: [] }, { id: "t3", phrases: ["Hey T3", "Hey tee three"] }], always: "jeff",

/* Conversations per device and assistant (each assistant keeps its own, per device) */

const convOf = (dev, id) => (conv[dev + ":" + id] ??= { turns: A[id].sample.map((t) => ({ ...t })), fresh: false });

const entry = (id) => dev().list.find((e) => e.id === id);
const nm = (id) => A[id].name;

function render(focusId) {
  const keep = focusId ?? (document.activeElement && document.activeElement.id) ?? null;
  renderStrip(); renderTopbar(); renderStage(); renderDock(); renderChat(); renderSheet();
  document.body.classList.toggle("phone", S.phone);
  document.body.classList.toggle("desktop", !S.phone);
  fit();
  if (keep) { const el = $(keep); if (el) el.focus({ preventScroll: true }); }
}

function toast(text) {
  const t = document.createElement("div");
  t.className = "toast";
  t.innerHTML = `<span class="d" aria-hidden="true"></span><span>${esc(text)}</span>`;
  $("toasts").appendChild(t);
  setTimeout(() => t.remove(), 6000);
}

function newConvTip() {
  const id = chatId(), others = dev().list.filter((e) => e.id !== id).map((e) => nm(e.id));
  return multi() ? `New conversation with ${nm(id)} (${others.join(" and ")} ${others.length > 1 ? "keep theirs" : "keeps its own"})` : "New conversation";
}
function newConversation() {
  const id = chatId(), c = convOf(S.device, id);
  c.turns = []; c.fresh = true;
  if (multi()) toast(`New conversation with ${nm(id)}. ${dev().list.filter((e) => e.id !== id).map((e) => nm(e.id)).join(" and ")} ${dev().list.length > 2 ? "keep their" : "keeps its"} own.`);
  else toast("New conversation.");
}

/* ---------- Phone frame scaling ---------- */
function fit() {
  const f = $("frame");
  if (!S.phone) { f.style.transform = ""; return; }
  const v = $("viewport").getBoundingClientRect();
  const s = Math.min(1, (v.height - 24) / 844, (v.width - 24) / 390);
  f.style.transform = `scale(${s})`;
}
window.addEventListener("resize", fit);

/* ---------- Events ---------- */
document.addEventListener("click", (e) => {
  const t = e.target.closest("button, [data-preset], label, a, #chat-scrim, #sheet-scrim");
  // Clicking outside the assistant menu closes it.
  if (S.menu && !e.target.closest("#who-menu") && !e.target.closest("#who-btn")) { S.menu = false; S.preset = ""; render(); }
  if (S.more && !e.target.closest(".more-wrap")) { S.more = false; renderDock(); }
  if (S.convMenu && !e.target.closest("#conv-menu") && !e.target.closest("#conv-btn")) { S.convMenu = false; renderChat(); }
  if (!t) return;
  if (t.dataset.preset) return applyPreset(t.dataset.preset);
  if (t.matches("a[href='#admin']")) { e.preventDefault(); toast("Admin opens in its own page (not part of this mock-up)."); return; }
  switch (t.id) {
    case "who-btn": S.menu = !S.menu; S.preset = S.menu ? "menu" : ""; render(S.menu ? firstMenuItem() : "who-btn"); return;
    case "gear": S.sheet = !S.sheet; S.menu = false; S.sheetNote = false; S.preset = S.sheet ? "sheet" : ""; render(S.sheet ? "sheet-close" : "gear"); return;
    case "sheet-close": case "sheet-scrim": S.sheet = false; S.preset = ""; render("gear"); return;
    case "chat-btn": S.chat = !S.chat; S.more = false; S.chatView = null; S.convMenu = false; render(S.chat ? "chat-input" : "chat-btn"); return;
    case "type-instead": S.chat = true; render("chat-input"); return;
    case "chat-close": case "chat-scrim": S.chat = false; S.chatView = null; S.convMenu = false; render("chat-btn"); return;
    case "chat-new": newConversation(); renderChat(); $("chat-new").focus(); return;
    case "conv-btn": S.convMenu = !S.convMenu; renderChat(); focusConvMenu(); return;
    case "more-btn": S.more = !S.more; renderDock(); if (S.more) $("more-new").focus(); return;
    case "more-new": S.more = false; newConversation(); render("more-btn"); return;
    case "start": S.state = dev().always ? "listening" : "asleep"; S.turn = null; S.preset = ""; render("mic"); return;
    case "end-btn": S.state = "notStarted"; S.turn = null; S.muted = false; S.preset = "notStarted"; render("start"); return;
    case "mic": S.muted = !S.muted; S.preset = ""; render("mic"); return;
    case "stop": if (S.state === "speaking" || S.state === "thinking") { timers.forEach(clearTimeout); timers.length = 0; stopReply(); } return;
    case "send": send(); return;
    case "mock-desktop": S.phone = false; render(); return;
    case "mock-phone": S.phone = true; render(); return;
    case "mock-hide": document.body.classList.add("mock-hidden"); fit(); $("mock-show").focus(); return;
    case "mock-show": document.body.classList.remove("mock-hidden"); fit(); $("mock-hide").focus(); return;
  }
  if (t.dataset.view) { S.chatView = t.dataset.view; S.convMenu = false; renderChat(); $("conv-btn").focus(); return; }
  if (t.dataset.choose !== undefined) {
    const id = t.dataset.choose || null;
    choose(id); S.menu = false;
    render("who-btn");
  }
});
function focusConvMenu() {
  if (!S.convMenu) { $("conv-btn").focus(); return; }
  const i = dev().list.findIndex((e) => e.id === chatId());
  $("ci-" + Math.max(0, i)).focus();
}
/** After a reply: the woken assistant keeps the turn for its own follow-up time, then the device falls back. */
function afterReply(record) {
  const id = speakingId(), d = dev();
  if (record) {
    const c = convOf(S.device, id), reply = A[id].clauses.join(" "), last = c.turns[c.turns.length - 1];
    const said = S.utter || d.woken.text;
    if (!last || last.you !== said || last.reply !== reply) c.turns.push({ you: said, tools: [A[id].liveTool], reply });
  }
  S.clause = 0;
  if (S.turn && !isDefault(S.turn) && A[S.turn].follow > 0) {
    S.state = "listening"; S.followUntil = Date.now() + A[S.turn].follow * 1000;
  } else {
    if (S.turn && !isDefault(S.turn)) { S.mockNote = `${nm(S.turn)} has no follow-up: one answer, then ${fallbackWords()}.`; S.mockNoteUntil = Date.now() + 8000; }
    S.turn = null; S.followUntil = 0; S.state = d.always ? "listening" : "asleep";
  }
  render();
}
function stopReply() { S.preset = ""; afterReply(false); if ($("stop")) $("stop").focus(); }
document.addEventListener("change", (e) => {
  const t = e.target;
  if (t.name === "sheet-assistant") { choose(t.value || null); S.sheetNote = true; render(t.id); return; }
  if (t.id === "mock-device") {
    S.device = t.value; S.menu = false;
    let p = S.preset || "listening";
    if ((p === "asleep" && dev().always) || (p === "menu" && !canPick()) || (p === "auto" && !canAuto())) p = "listening";
    applyPreset(p); return;
  }
  if (t.id === "mock-picking") { S.picking = t.checked; if (!S.picking) S.menu = false; render(); return; }
});
document.addEventListener("input", (e) => {
  if (e.target.id === "chat-input") {
    S.draft = e.target.value;
    $("send").disabled = !S.draft.trim();
    e.target.style.height = "auto";
    e.target.style.height = Math.min(e.target.scrollHeight, 148) + "px";
  }
});
function send() {
  const text = S.draft.trim();
  if (!text) return;
  const id = chatId(), c = convOf(S.device, id);

}
function firstMenuItem() {

}

document.addEventListener("keydown", (e) => {
  const inField = e.target.closest && e.target.closest("input, textarea, select");
  if (e.target.id === "chat-input" && e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); return; }

    const items = [...document.querySelectorAll("#conv-menu .mi")], i = items.indexOf(e.target);

  }
  if (e.target.id === "conv-btn" && (e.key === "ArrowDown" || e.key === "ArrowUp") && !S.convMenu) { e.preventDefault(); S.convMenu = true; renderChat(); focusConvMenu(); return; }

    const items = [...document.querySelectorAll("#who-menu .mi")], i = items.indexOf(e.target);
    if (e.key === "ArrowDown") { e.preventDefault(); items[(i + 1) % items.length].focus(); return; }
    if (e.key === "ArrowUp") { e.preventDefault(); items[(i - 1 + items.length) % items.length].focus(); return; }
    if (e.key === "Home") { e.preventDefault(); items[0].focus(); return; }
    if (e.key === "End") { e.preventDefault(); items[items.length - 1].focus(); return; }
    if (e.key === "Tab") { S.menu = false; S.preset = ""; render("who-btn"); return; }
  }
  if (e.target.id === "who-btn" && (e.key === "ArrowDown" || e.key === "ArrowUp") && !S.menu) { e.preventDefault(); S.menu = true; S.preset = "menu"; render(firstMenuItem()); return; }
  if (e.key === "Escape") {
    if (S.menu) { e.preventDefault(); S.menu = false; S.preset = ""; render("who-btn"); return; }
    if (S.more) { e.preventDefault(); S.more = false; renderDock(); $("more-btn").focus(); return; }
    if (S.sheet) { e.preventDefault(); S.sheet = false; S.preset = ""; render("gear"); return; }
    if (S.chat && (e.target.closest("#chat") || S.phone)) { e.preventDefault(); S.chat = false; S.chatView = null; render("chat-btn"); return; }
    if (S.state === "speaking" && !inField) { e.preventDefault(); stopReply(); return; }
    return;
  }
  // Focus stays inside the settings sheet (modal).
  if (S.sheet && e.key === "Tab" && $("frame").contains(document.activeElement)) {
    const f = [...$("sheet").querySelectorAll('button, select, input, a[href], summary')].filter((x) => x.offsetParent !== null);
    const first = f[0], last = f[f.length - 1];

    return;
  }
  if (inField || e.metaKey || e.ctrlKey || e.altKey || e.target.closest(".mock")) return;
  const k = e.key.toLowerCase();
  if (k === "s") { e.preventDefault(); S.sheet = !S.sheet; S.menu = false; S.sheetNote = false; render(S.sheet ? "sheet-close" : "gear"); }
  else if (k === "c") { e.preventDefault(); S.chat = !S.chat; S.chatView = null; S.convMenu = false; render(S.chat ? "chat-input" : "chat-btn"); }
  else if (k === "m" && started()) { e.preventDefault(); S.muted = !S.muted; S.preset = ""; render(); }
});

/* ---------- Captions progressing ---------- */
setInterval(() => {
  if (S.state === "speaking" && !S.muted) {
    const n = A[speakingId()].clauses.length;
    S.clause += 1;                          // clause n is one held beat on the last clause
    if (S.clause > n) { afterReply(true); return; }
    renderCaptions();
    if (S.chat) renderMessages();
  }
}, 1700);
setInterval(() => {
  if (S.followUntil && S.state === "listening" && S.turn && Date.now() >= S.followUntil) {
    S.turn = null; S.followUntil = 0; S.state = dev().always ? "listening" : "asleep"; render();
  }
  renderMockNote();
}, 250);
setInterval(() => {
  if (S.state === "hearing" && !S.muted) {
    const n = dev().hear.text.split(" ").length;
    S.words = S.words >= n + 4 ? 1 : S.words + 1;
    renderCaptions();
  }
}, 320);

/* ---------- The luminous line (port of apps/web/src/lib/visualiser.ts, with stand-in levels) ---------- */
const STATE_PARAMS = {
  "not-started": { color: "ink-faint", alpha: 0.4, aMin: 0, omega: [0, 0, 0], weights: [1, 0.5, 0.3] },
  speaking: { color: "voice", alpha: 1, aMin: 3, omega: [2.0, 2.8, 3.9], weights: "bands", glow: { blur: 12, alpha: 0.4 } },
  thinking: { color: "voice", alpha: 0.7, aMin: 4, omega: [1.2, 1.6, 2.1], weights: [1, 0.5, 0.3], sweep: true },
  muted: { color: "ink-faint", alpha: 1, aMin: 0, omega: [0, 0, 0], weights: [1, 0.5, 0.3], gap: true },
  hearing: { color: "you", alpha: 1, aMin: 3, omega: [2.4, 3.1, 4.2], weights: [1, 0.7, 0.5], glow: { blur: 8, alpha: 0.35 } },
  listening: { color: "you", alpha: 0.85, aMin: 2, omega: [0.6, 0.9, 1.3], weights: [1, 0.6, 0.35], breathe: true },
  asleep: { color: "you", alpha: 0.42, aMin: 1.5, omega: [0.25, 0.35, 0.45], weights: [1, 0.5, 0.3], breathe: true }

(function visualiser() {
  const canvas = $("cv"), g = canvas.getContext("2d");
  const probeC = document.createElement("canvas"); probeC.width = probeC.height = 1;
  const probe = probeC.getContext("2d", { willReadFrequently: true });

  const readColors = () => {
    const cs = getComputedStyle(document.documentElement);
    for (const k of Object.keys(colors)) {

      probe.clearRect(0, 0, 1, 1); probe.fillStyle = "#000"; probe.fillStyle = v; probe.fillRect(0, 0, 1, 1);
      const d = probe.getImageData(0, 0, 1, 1).data; colors[k] = [d[0], d[1], d[2]];

  const K = [1.5, 2.5, 4.0], PHI = [0, 2.1, 4.2], STROKE = [2, 1.5, 1], OPACITY = [1, 0.45, 0.25], BAND_BASE = [0.5, 0.3, 0.2];

  let rgb = [...colors["ink-faint"]], alpha = 0.4, fromRgb = rgb, fromAlpha = alpha, toKey = "ink-faint", toAlpha = 0.4, fadeStart = -1, shown = "not-started";
  let last = performance.now();
