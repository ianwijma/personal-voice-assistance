es are mirrored above and below the centre line and spawn, grow and fade at random positions.",states:"A flat white line at rest; coloured lobes bloom while speech comes in. Thinking and reply states are not confirmed from the sources I opened.",drivenBy:"Stated (siriwave ios9 source): each colour spawns 2-5 curves with random amplitude 0.3-1, offset -3..3, width 1-3, speed 0.5-1, and despawn timeout 500-2000 ms; each curve is |A sin(v x - phase)| times K(x) = (4/(4+x^2))^4, and all of it is scaled by one global amplitude. Inferred: in Siri that global amplitude was mic loudness; the randomness gives it the 'alive' look, not the audio.",takeaway:"Pair a single loudness value with a random spawn/despawn process so the shape never repeats. Additive colour blending makes overlaps bright without extra drawing work.",sources:["https://github.com/kopiro/siriwave","https://raw.githubusercontent.com/kopiro/siriwave/master/src/ios9-curve.ts"]},{product:"Siri compact orb",maker:"Apple",era:"iOS 14 to iOS 17 (2020-2023)",form:"orb",look:"A small glowing orb floats to the bottom of the screen instead of a full-screen takeover; on iPad it sits bottom right. Answers appear as notification-like banners above it.",states:"Per MacStories, the orb 'pulses and morphs as you speak', then shows a 'cute loading animation' while the request is processed. A distinct speaking animation is not described.",drivenBy:"Stated: pulses and morphs with your speech. Inferred: loudness-driven deformation of an orb surface; Apple has not published how it is computed.",takeaway:"A small, local orb can carry the whole state machine while leaving the rest of the screen usable. Speech morphing plus a separate loading loop is enough to tell hearing from thinking.",sources:["https://macstories.net/stories/ios-and-ipados-14-the-macstories-review/7"]},{product:"Siri edge glow (Apple Intelligence)",maker:"Apple",era:"iOS 18.1 onward (2024-)",form:"edge-light",look:"A glowing light wraps around the edge of the whole screen while Siri is active, leaving the content visible (multicoloured, inferred from use). Apple names iPhone, iPad and CarPlay as places it appears.",states:"Apple's text only says the glow shows when Siri is active. Inferred from use: it ripples more while you speak and settles when Siri answers; Apple has not documented the per-state behaviour.",drivenBy:"Stated: 'an elegant glowing light that wraps around the edge of the screen when active'. Inferred: listening motion follows voice loudness; not confirmed by Apple.",takeaway:"The frame of the screen is a display surface: a glow at the edge says 'listening' without hiding anything. It also works at a glance from the side, as on a car screen.",sources:["https://www.apple.com/newsroom/2024/09/apple-intelligence-comes-to-iphone-ipad-and-mac-starting-next-month/"]},{product:"HomePod top light",maker:"Apple",era:"2018-",form:"light-ring",look:"A swirl of multicoloured light under the top touch surface of HomePod and HomePod mini. A white light shows audio playing, green pulsing a transferred call, white spinning updating.",states:"Apple uses one multicoloured light for all three phases: 'Siri is listening, thinking, or responding'. The same light also plays for Sound Glow on some models.",drivenBy:"Stated: colour and motion encode state, not the phase. Not confirmed: whether the swirl follows voice loudness.",takeaway:"Apple chose not to separate listening, thinking and speaking on HomePod; the sound itself carries the phase. A product can treat 'Siri is here' as the only visual state that matters.",sources:["https://support.apple.com/en-us/101607"]},{product:"ChatGPT voice conversations (standard voice)",maker:"OpenAI",era:"September 2023 to 2024",form:"orb",look:"A plain circle in the middle of the screen. It starts grey, turns white, and breaks into a few small ovals.",states:"Listening: the grey circle turns white while you speak. Thinking: it becomes 'a white cloud-like moving image'. Speaking: it 'breaks into four tiny ovals and transforms' as the voice talks.",drivenBy:"Stated: the state changes above. Inferred: the ovals bounce with the output loudness, like a four-bar level meter; OpenAI has not described the driver.",takeaway:"Three clearly different shapes (solid circle, blob, separate dots) make the phase readable without colour. The four ovals act as a tiny equaliser that reads as 'talking'.",sources:["https://interestingengineering.com/culture/chatgpt-voice-feature-ios-android"]},{product:"ChatGPT Advanced Voice Mode orb",maker:"OpenAI",era:"May 2024 demo; blue orb September 2024; optional from November 2025",form:"orb",look:"In the May 2024 GPT-4o demo, a black dot turned into a stylised waveform while speaking. The shipped mode replaced it with a blue animated sphere; inferred from use, a soft cloud-like texture that drifts inside the circle.",states:"Demo: a dot at rest, a waveform when ChatGPT speaks and in the input area when you speak. Shipped orb: reviewers say it pulses with the conversation; OpenAI has not published a per-state spec.",drivenBy:"Stated: TechCrunch reports the blue sphere replaced the black dots. Not confirmed: any public statement by OpenAI on how the orb is rendered or what audio feature drives it. Inferred: an internal noise texture that moves faster and swells with output loudness.",takeaway:"A textured orb with slow internal flow reads as calm and alive even when nothing happens. In November 2025 OpenAI moved voice into the chat thread with live text and images, keeping the orb only as Settings, Voice Mode, Separate mode: the transcript became the main feedback.",sources:["https://techcrunch.com/2024/09/24/openai-rolls-out-advanced-voice-mode-with-more-voices-and-a-new-look","https://techcrunch.com/2024/05/13/chatgpts-new-face-is-a-black-hole","https://www.macrumors.com/2025/11/26/chatgpt-voice-mode-update-seamless-chat/"]},{product:"Google dots (Google app, Assistant)",maker:"Google",era:"2015 to about 2026 (reported replaced in January 2026)",form:"dots-bars",look:"Four dots in Google blue, red, yellow and green that move along geometric arcs with a fixed set of quick easing curves. Google calls them a distillation of the logo for interactive and assistive moments.",states:"Google's design team lists the expressions it built: listening, thinking, replying, incomprehension and confirmation. Widely reported but not confirmed from a source I opened: while you speak the dots become bouncing equaliser bars, and they spin while results load.",drivenBy:"Stated: motion follows 'consistent paths and timing' from a standard set of easing curves, so it looks spontaneous but is rule-based. Inferred: the bars in the listening state follow mic loudness.",takeaway:"A small vocabulary of shapes with authored easing can cover five states, including a 'did not understand' state most products skip. Brand colours can be the state indicator.",sources:["https://design.google/library/evolving-google-identity/"]},{product:"Google Home LED design language",maker:"Google",era:"2016- (patents granted 2019-2020)",form:"light-ring",look:"A fixed array of full-colour LEDs under the top of a speaker, using the four Google colours split into quadrants. The patent calls it a 'grammar of colors, patterns, and specific motion' covering more than twenty device states.",states:"Listening: LEDs in one colour with different and varying brightness. Thinking: a white chasing animation where more LEDs light up per cycle, with brand colours avoided for contrast and the mics off. Responding: a subset of LEDs with brightness that varies with the user's 'voice speed'.",drivenBy:"Stated (patent): per-state duration, pulse rate, duty cycle, colour sequence and brightness. Stated: the responding brightness tracks voice speed, not loudness. No timing numbers are given.",takeaway:"Use a different colour family for thinking (white) than for listening and speaking (brand colour) so the hand-off is unmistakable. Tempo, not just loudness, is a usable driver.",sources:["https://patents.google.com/patent/US10861461"]},{product:"Gemini visual language and Gemini Live",maker:"Google",era:"2024-",form:"edge-light",look:"Blurred blue-to-purple gradients with sharp, almost opaque leading edges that diffuse at the tail, used as directional pointers. During screen sharing Gemini Live shows a glow around the screen, similar to the Ask Gemini overlay.",states:"Google's design team says 'a rippling motion in a radial gradient can be used for voice waves' and 'concentrated and diffused gradients are used when transcribing voice'; thinking is 'inner activity within the motion'. Current Live screens use a small pill-shaped waveform; later redesigns are only reported from app teardowns.",drivenBy:"Stated: authored motion with a defined start and end, 'anticipation, then release'. Not confirmed: what audio feature drives the ripple or the waveform in Gemini Live.",takeaway:"Give the gradient a direction (sharp front, soft tail) so motion reads as energy going somewhere. Radial ripples for voice and inner churn for thinking are a clean split.",sources:["https://design.google/library/gemini-ai-visual-design","https://9to5google.com/2025/03/24/gemini-astra-screen-glow/"]},{product:"Echo light ring",maker:"Amazon",era:"2014-",form:"light-ring",look:"A ring of light around the top of the speaker. Listening is solid blue with a brighter cyan segment that points at the person speaking.",states:"Amazon's brand guide: listening is 'directional blue' during an utterance, thinking is 'alternating blue' right after the utterance and before Alexa answers, responding is 'directional blue' again. Digital Trends describes thinking as alternating solid blue and solid cyan.",drivenBy:"Stated: the cyan segment shows the direction the microphone array hears the voice from. The listening and thinking patterns are fixed, authored animations. Not confirmed: whether ring brightness follows loudness while Alexa speaks.",takeaway:"Pointing at the speaker is the strongest 'I am listening to you' cue a light can give, and it needs only a direction value. Thinking is a different rhythm in the same colour, not a new colour.",sources:["https://developer.amazon.com/en-US/alexa/branding/echo-guidelines/identity-guidelines/light-ring","https://www.digitaltrends.com/home/what-the-lights-on-your-echo-device-mean/"]},{product:"Echo Show light bar and Alexa+ indicator",maker:"Amazon",era:"Echo Show 2017-; Alexa+ 2025-",form:"dots-bars",look:"A thin bar along the bottom of the screen. Classic Echo Show: a cyan spotlight on a blue bar. Alexa+: a small, solid blue light that pulses wider, plus a blue wave that travels across.",states:"Classic: cyan on blue means listening, and the spotlight moves briefly while processing; teal blue means ready to talk without the wake word. Alexa+: a pulsing blue light means listening, 'a blue light moving like an ocean wave from left to right' means thinking, and a small solid blue light means ready to listen. No speaking indicator is described.",drivenBy:"Stated (Amazon help): 'The pulsing matches your voice - wider pulses for louder speech, shorter pulses for softer speech.' The thinking wave is a scripted loop.",takeaway:"Amazon documents plain loudness as the listening driver, mapped to width. A ready-to-listen state (small, solid, still) is different from listening (pulsing) and from thinking (travelling wave).",sources:["https://digprjsurvey.amazon.com/csad/help/node/T2Xd07kMXxJPkWIgXD","https://digprjsurvey.amazon.co.uk/csad/help/node/TaI3C5lPJp9GBipa94"]},{product:"Cortana circle",maker:"Microsoft",era:"Windows Phone 8.1 to Windows 10 (2014-2020)",form:"orb",look:"A circular ring or disc that changes shape and colour instead of a character; no face. Extracted icon packs list animation names such as Listening, Speaking, Thinking, Greeting, Alert and emotions like Abashed, Bouncy, Calm, Elated and Satisfied.",states:"Separate authored animations for listening, speaking and thinking, plus emotional variants. Commentators noted several emotions looked alike (thinking similar to satisfied and considerate).",drivenBy:"Stated: named, pre-made animation clips. Inferred: emotion clips were chosen from the answer content, not computed from audio. Not confirmed: whether any clip responded to loudness.",takeaway:"An abstract ring can carry emotion through shape and timing, but too many emotions in one simple shape blur together. A few strongly different states beat many subtle ones.",sources:["https://nokiapoweruser.com/this-is-how-cortana-will-greet-you-cortanas-icon-pack-extracted-language-change-possible/"]},{product:"Copilot Voice with Mico",maker:"Microsoft",era:"October 2025-",form:"avatar",look:"A floating, blob-like avatar that changes shape and colour. On by default in Copilot voice mode and can be switched off; tapping it repeatedly turns it into Clippy.",states:"Microsoft says it 'listens, reacts, and even changes colors to reflect your interactions'. A per-state spec has not been published.",drivenBy:"Stated: shape and colour react to the conversation. Not confirmed: whether expressions come from the voice signal, the model's text, or authored triggers.",takeaway:"A soft, expressive blob sits between an orb and a character: expressive without the uncanny valley. Making it optional matters to users who find characters childish.",sources:["https://techcrunch.com/2025/10/23/microsofts-mico-is-a-clippy-for-the-ai-era"]},{product:"Claude voice mode",maker:"Anthropic",era:"2025-",form:"orb",look:"A central orb on the voice screen; a 2026 update reportedly added a glow around it during active sessions. Voice mode is started from a sound-wave icon and the conversation is saved as a text transcript.",states:"Press reports the orb 'pulses with a visual glow to signal that the model is speaking or listening'. Anthropic's help article describes hands-free mode (replies when you pause) and push-to-talk, but no visual states.",drivenBy:"Not confirmed: Anthropic's own documentation does not describe the orb or its driver. Inferred: glow follows the active voice's loudness.",takeaway:"Push-to-talk and hands-free are offered side by side; the visual has to say which one is active. Not much else can be concluded from public material.",sources:["https://support.claude.com/en/articles/11101966-using-voice-mode-on-claude-mobile-apps","https://cryptobriefing.com/anthropic-claude-voice-mode-ui-update/"]},{product:"Perplexity voice mode",maker:"Perplexity",era:"2025-",form:"particles",look:"A sphere made of dots of different sizes that rotates clockwise at a steady rhythm, each dot on its own small orbit, which gives a breathing feel. Touching it pushes dots out in a ripple from the finger; they spring back on release.",states:"While you speak the sphere pulses with your loudness. Separate thinking and speaking treatments are not described in the sources I opened.",drivenBy:"Stated (sspai, Dive Club): written as a Metal shader on iOS by product design lead Gunnar Gray, and it pulses with input volume. Not confirmed: whether reply audio drives it too.",takeaway:"A particle sphere that is also touchable makes the visual feel physical, and constant slow rotation keeps it alive with no audio at all. Designing in shader code means the prototype is the product.",sources:["https://sspai.com/post/103208","https://dive-club.beehiiv.com/p/agency-flashlight"]},{product:"Meta AI ring",maker:"Meta (motion by Animade)",era:"Not dated in the source (Meta AI era, 2024-)",form:"light-ring",look:"The Meta AI ring, a loop derived from the Meta logo, animated as a library of 25 Lottie animations including 16 voice-state animations.",states:"Animade: the ring 'moves outwards when it's responding, inwards when it's listening'. Separate sound waves respond to the user's speech.",drivenBy:"Stated: the sound waves 'visually scale according to the pitch and volume of your voice'; the state animations are authored Lottie clips.",takeaway:"Direction of motion encodes who is talking: inward for taking in, outward for giving out. That rule is simple, readable and works with any shape.",sources:["https://archive.animade.tv/work/meta-ai-ring"]},{product:"Grok Companions (Ani, Rudy, Valentine)",maker:"xAI",era:"July 2025 to 2026",form:"avatar",look:"Full-screen 3D animated characters in Grok's voice mode: Ani, an anime-style character, and Rudy, with gestures, moods and options unlocked at higher relationship levels.",states:"The character idles, reacts with moves and expressions, and speaks. Rudy has a separate 'Bad Rudy' mood.",drivenBy:"Stated: 'fully 3D animated characters that can interact with users via voice' with different moves and moods. Not confirmed: the lip-sync method (audio-driven or phoneme-driven) and how expressions are triggered.",takeaway:"A full character turns the assistant into a relationship product, with engagement mechanics that are hard to separate from the visual. It shows how much a character changes what users expect.",sources:["https://www.testingcatalog.com/grok-debuts-interactive-ai-companions-on-ios-with-anime-avatars/"]},{product:"Hume EVI web SDK",maker:"Hume AI",era:"2024 to 2026 (EVI API sunset announced for November 2026)",form:"dots-bars",look:"No signature visual: Hume's SDKs hand developers spectrum data to draw their own bars or orbs, as two arrays.",states:"The SDK separates sides: micFft for the microphone and fft for the assistant's output, so each side can have its own visual.",drivenBy:"Stated (SDK types): an AnalyserNode with a 2048-point FFT polled every 16 ms (about 60 Hz), mapped by default to 24 Bark-scale bands, with a custom transform hook. Inferred: the bars are spectrum-driven per band, not loudness alone.",takeaway:"24 perceptual (Bark) bands at 60 Hz is a vendor-chosen default for voice visuals, and it matches this lab's band count. Keeping the user and assistant signals separate is the norm.",sources:["https://cdn.jsdelivr.net/npm/hume@0.15.15/dist/cjs/wrapper/EVIWebAudioPlayer.d.ts","https://cdn.jsdelivr.net/npm/@humeai/voice-react@0.2.14/README.md"]},{product:"ElevenLabs UI Orb and Bar Visualizer",maker:"ElevenLabs",era:"2025- (open source)",form:"orb",look:"A WebGL (three.js) orb: 7 soft ovals arranged in polar coordinates around the centre, shaped by a Perlin noise texture, between two noisy rings, filled with a two-colour gradient (default #CADCFC and #A0B9D1). The companion bar visualiser shows a row of bars, 5 bands by default.",states:"Orb states: idle, listening, thinking, talking. Bar visualiser: listening and thinking play a scripted centre-out highlight sequence, connecting plays a two-ends-inward sweep, speaking lights all bars and follows the audio.",drivenBy:"Stated (source): two scalars, input volume and output volume, each eased by 20% per frame. Input volume changes oval height and ring radius and opacity; output volume speeds up the internal flow (speed = 0.1 + 0.9 * (1 - (out - 1)^2)) and the angular distortion. Without live audio, sine-based fake volumes stand in for each state.",takeaway:"Map the user's loudness to size and the assistant's loudness to speed, so the two sides feel different on one shape. Ship a believable scripted fallback per state for when there is no audio.",sources:["https://github.com/elevenlabs/ui","https://raw.githubusercontent.com/elevenlabs/ui/main/apps/www/registry/elevenlabs-ui/ui/orb.tsx","https://raw.githubusercontent.com/elevenlabs/ui/main/apps/www/registry/elevenlabs-ui/ui/bar-visualizer.tsx"]},{product:"Spotify voice-feedback patent (curved wave on a loop)",maker:"Spotify",era:"Patent US11995756 (granted 2024)",form:"orb",look:"A circle (or several stacked loops) where a sine wave is superimposed on part of the circumference, bending the radius inward. The wave is attenuated along the arc so only one section of the loop ripples.",states:"Listening: the warped loop animates. Processing: the icon changes to a distinct form such as layered loops. Confirmation: concentric loops. Error: colour change or no animation. The icon may also animate with the device's audio output.",drivenBy:"Stated (patent): the rippling section is placed in the direction the voice comes from; amplitude follows microphone level; angular frequency also rises with level so loud speech looks faster.",takeaway:"This combines Alexa's direction cue with Siri's wave on a single circle. Tying wave speed to loudness, not only height, is a cheap way to add energy.",sources:["https://patents.google.com/patent/US11995756"]},{product:"Rabbit R1 rabbit",maker:"Rabbit (design with Teenage Engineering)",era:"2024-",form:"avatar",look:"A cartoon rabbit on the small screen of a handheld with a push-to-talk button.",states:"While you hold the push-to-talk button and speak, the rabbit bounces up and down with its ears up; the ears settle when you stop. Gizmodo notes almost no status feedback while the query is being worked on.",drivenBy:"Stated: listening is tied to the push-to-talk button (no always-listening). Inferred: the bounce is a scripted loop, not audio-driven.",takeaway:"Ears up is a readable, charming 'listening' pose borrowed from animals. Missing thinking feedback was a named complaint, so thinking needs its own visual.",sources:["https://gizmodo.com/rabbit-r1-review-ai-companion-performance-1851452097"]},{product:"Humane Ai Pin Trust Light",maker:"Humane",era:"2023-2025",form:"other",look:"A small light on the pin that shows whenever any sensor (camera, mic) is active, managed by a dedicated privacy chip. A laser projects text onto the palm.",states:"No wake word: the pin listens only on touch. The Trust Light marks sensors on; separate listening, thinking and speaking visuals are not described.",drivenBy:"Stated: hardware-enforced sensor indicator. Not confirmed: any audio-driven animation.",takeaway:"A light whose job is honesty (mic is on) is different from a light whose job is personality; a voice UI should keep the first one simple and never animate it decoratively.",sources:["https://techcrunch.com/2023/11/09/humanes-ai-pin/amp"]},{product:"Jibo",maker:"Jibo Inc. (Cynthia Breazeal)",era:"2014-2019",form:"eyes",look:"A table robot with a colour LCD touchscreen face showing a single animated eye, designed as a ball, on a body that turns and tilts on three full-revolute axes.",states:"The eye blinks and the body turns toward people; a 360-degree mic array localises sound and cameras track faces. Specific listening and thinking animations are not described in the sources I opened.",drivenBy:"Stated: animations built with a web animation tool and a library of animations and vocalisations; Not confirmed: audio-driven eye motion or how attention and authored clips hand over.",takeaway:"One abstract eye plus body orientation gives attention cues (turning to you) without a human face.",sources:["https://spectrum.ieee.org/cynthia-breazeal-unveils-jibo-a-social-robot-for-the-home","https://robohub.org/developing-jibo-animating-the-eye"]},{product:"Anki Cozmo and Vector eyes",maker:"Anki (later Digital Dream Labs)",era:"2016-2019",form:"eyes",look:"Two animated eyes on a small face screen. Anki hired former Pixar and DreamWorks animators; the eye rig has controls for brow, gaze direction, cheeks, openness (squint, sleepy), head tilt and squash-and-stretch.",states:"Not confirmed from the docs I opened: the exact wake-word listening animation. Blinking runs on a timer between authored clips.",drivenBy:"Stated (community docs from Anki material): eye parameters are interpolated frame to frame between authored poses; blinks are timer-driven. The team drew on Keith Lango's work on saccades: quick, frequent eye shifts read as busy thought, slow shifts as pondering.",takeaway:"Eyes alone, with squash, squint and saccade timing, carry a full personality. Saccade rate is a ready-made 'thinking' signal: fast darting for working, slow drift for idle.",sources:["https://randym32.github.io/Anki.Vector.Documentation/tools/Eye%20animation.html","https://randym32.github.io/Anki.Vector.Documentation/guides/Vector%20character%20design%20guide.html","https://techcrunch.com/2022/09/15/ankis-spiritual-successor-hits-kickstarter-with-some-impressive-moves"]},{product:"ElliQ",maker:"Intuition Robotics (design by fuseproject)",era:"2017-",form:"light-ring",look:"A table lamp-like robot with a head that tilts and turns and clear halo lights on its face and head, next to a tablet showing large text.",states:"A 'ring of light' appears when ElliQ is listening and ready to help; when called, she also asks a question aloud. Speaking-state light behaviour is not described.",drivenBy:"Stated: the light marks listening. Not confirmed: whether the light or head motion follows voice.",takeaway:"For older users, the light is paired with a spoken prompt so listening is never signalled by visuals alone. Large text on a separate screen carries the content.",sources:["https://elliq.com/pages/faqs"]},{product:"NOMI (NIO in-car assistant)",maker:"NIO",era:"2017-",form:"face",look:"A small ball-shaped dashtop device in the form of a head and face. Two motors, one horizontal and one vertical, turn it to face whoever is speaking.",states:"NOMI turns toward the occupant who speaks and addresses them; the team aimed for 'tiny, almost invisible movements' timed to the millisecond.",drivenBy:"Stated (NIO): orientation follows the speaker's seat; movement design was studied from film and animation so it would feel emotion-driven, not robotic. Not confirmed from NIO's post: the eye designs and how expressions are chosen.",takeaway:"Turning to face the speaker is the strongest attentiveness cue in the survey. On a flat screen it can be faked by shifting gaze toward the person who is talking.",sources:["https://www.nio.com/blog/history-behind-nomi"]},{product:"MBUX Virtual Assistant",maker:"Mercedes-Benz",era:"Shown at CES 2024",form:"particles",look:"A living version of the Mercedes three-pointed star made of a star field on the centre screen.",states:"The star field changes colour, and icons appear over it to convey 'like', 'celebrate', 'laugh' and 'confirm'. Replies get shorter if it senses driver frustration.",drivenBy:"Stated (Motor1): colour and overlaid icons express reactions. Not confirmed: whether the field reacts to voice loudness.",takeaway:"A brand mark built from particles can carry emotion through colour and density without a face. Discrete reaction icons over an ambient field are a clean way to show intent.",sources:["https://www.motor1.com/news/703697/mercedes-benz-ai-ces-2024/"]},{product:"Razer Project AVA",maker:"Razer",era:"CES 2026",form:"avatar",look:"A desk cylinder showing a 5-inch animated 3D hologram character (Kira, Zane and others), with an HD camera and far-field mic; demos ran on xAI Grok.",states:"Razer lists 'eye-tracking, facial expressions, and lip sync'; the avatar looks at the user via the camera.",drivenBy:"Stated: eye tracking from the camera and lip sync. Not confirmed: whether lip sync is from audio or from phoneme data.",takeaway:"Eye contact from camera tracking is presented as the headline feature, ahead of the face itself. Reviewers found the conversation the weak point, not the visuals.",sources:["https://www.razer.com/newsroom/product-news/project-ava/"]},{product:"Furhat robot head",maker:"Furhat Robotics (KTH Stockholm)",era:"2011-",form:"face",look:"An animated human face back-projected from inside onto a translucent face-shaped mask on a pan-tilt neck. Gestures such as blinking, smiling, nodding and frowning are built in.",states:"Built for multi-party talk: it tracks up to 10 people and has controls for initiative, turn-taking and interruptions. KTH research covers gaze, joint attention and backchannels in turn-taking.",drivenBy:"Stated: an automatic lip-sync model. Stated (KTH): a flat on-screen agent suffers the Mona Lisa effect, so it cannot hold exclusive mutual gaze with one person; the 3D mask fixes that. KTH also gives feedback while the person speaks with head nods and short 'mhm' sounds. Not confirmed: the viseme set used.",takeaway:"Gaze direction is the main social signal, and flat screens lose it (the Mona Lisa effect). On a flat display, use head turn and pupil position strongly so 'looking at you' still reads.",sources:["https://furhatrobotics.com/furhat-robot","https://www.speech.kth.se/~gabriel/research.html"]},{product:"HAL 9000",maker:"2001: A Space Odyssey (Kubrick, 1968)",era:"1968",form:"eyes",look:"A single glowing lens: a Nikkor 8mm f/8 fisheye with its built-in red filter, lit by a white tungsten bulb behind it, which gives a red field with a yellow-white centre.",states:"The eye does not change between listening and speaking; it is a constant presence while the voice does the work.",drivenBy:"Stated: static practical lighting, no animation. The yellow centre comes from tungsten light overpowering the thin filter.",takeaway:"A still, glowing point with a hot centre already reads as attention. Keep this as the lower bound: if a design adds motion, it has to say more than HAL's still eye.",sources:["https://sites.google.com/site/theageofplastic3d/hal-9000s-faceplates/iii-the-nikkor-lens"]},{product:"KITT voice modulator",maker:"Knight Rider (NBC, 1982-1986)",era:"1982-1986",form:"dots-bars",look:"Season one: a flashing red square on the dashboard. From episode 14 ('Heart of Stone'): three sectioned vertical bars of red light, a design taken from KARR, whose modulator was greenish-yellow.",states:"Lights only when KITT speaks; dark otherwise. The front scanner is a separate oscillating red light.",drivenBy:"Inferred: the bars act as a VU meter of the voice, with the centre bar tallest; the sources I opened do not document the prop's circuit.",takeaway:"Three symmetric level bars are the most recognisable 'machine is talking' icon in pop culture, and they need nothing but loudness.",sources:["https://encycloreader.org/r/wikipedia.php?q=KITT"]},{product:"OS1 / Samantha in Her",maker:"Her (Spike Jonze, 2013)",era:"2013",form:"other",look:"No face and no avatar: Samantha lives in an earpiece and a small phone with a neutral camera; the earpiece gives a few beeps to mark attention and mode changes.",states:"Listening and speaking are not shown visually at all; voice and short sounds carry everything.",drivenBy:"Stated (sci-fi interfaces review): the OS is deliberately disembodied; a stripe on the phone can glow red as an alert.",takeaway:"The strongest fictional voice companion has no visual, which lets people imagine their own. A visual should support the voice, not compete with it; short sounds for attention are a cue to borrow.",sources:["https://scifiinterfaces.com/2014/02/11/her-interface-components/"]},{product:"Oculus / Meta Lipsync",maker:"Meta",era:"SDK 1.16 onward (docs marked no longer updated)",form:"other",look:"A plugin that turns an audio stream (mic or file) into weights for 15 visemes: sil, PP, FF, TH, DD, kk, CH, SS, nn, RR, aa, E, ih, oh, ou. Each viseme drives a morph target on the avatar.",states:"Real time on live speech; a precomputed mode exists for recorded audio. Version 1.30 added laughter detection.",drivenBy:"Stated: a temporal convolutional network on a stream of past low-level audio features, with lookahead only offline; over 30% higher viseme accuracy on English than the earlier shallow network. Language-independent viseme set.",takeaway:"Viseme weights (a blend), not one viseme at a time, are what make mouths look smooth. The 15-viseme set is the de facto standard that other tools copy.",sources:["https://developers.meta.com/horizon/documentation/unity/audio-ovrlipsync-unity/","https://developers.meta.com/horizon/blog/tech-note-enhancing-oculus-lipsync-with-deep-learning/"]},{product:"wawa-lipsync",maker:"wass08 (open source)",era:"Current",form:"other",look:"A TypeScript library that attaches a Web Audio AnalyserNode to an audio element and outputs one of the 15 Oculus-style visemes each animation frame.",states:"Silence, plosive, fricative and vowel act as states in a small state machine so the mouth does not jitter between unrelated shapes.",drivenBy:"Stated (source): FFT size 2048; energy in 7 bands (50-200, 200-400, 400-800, 800-1500, 1500-2500, 2500-4000, 4000-8000 Hz), spectral centroid, volume and per-band deltas against a 10-frame history; hand-written scoring rules pick the viseme (for example, silence when volume is below 0.2).",takeaway:"Seven formant-ish bands plus centroid and deltas are enough for a believable browser-only mouth. The state machine for consonant classes is the part that removes flicker.",sources:["https://github.com/wass08/wawa-lipsync","https://raw.githubusercontent.com/wass08/wawa-lipsync/main/packages/wawa-lipsync/src/lipsync.ts"]},{product:"Rhubarb Lip Sync",maker:"Daniel S. Wolf (open source)",era:"Current",form:"other",look:"A command-line tool that turns a recording into a timeline of cartoon mouth shapes A-F plus optional G, H, X: closed (P B M), slightly open teeth, open (EH AE), wide open (AA), slightly round (AO ER), puckered (UW OW W), F/V, L, and idle.",states:"Offline batch processing of finished audio files, not real time.",drivenBy:"Stated: speech recognition (PocketSphinx for English, or a language-independent phonetic recogniser); supplying the dialog text improves results. Output as TSV, XML or JSON.",takeaway:"Six to nine hand-drawable mouth shapes are enough for a cartoon face, and they are what animators actually use. A simple face design should target this set, not 15 visemes.",sources:["https://github.com/DanielSWolf/rhubarb-lip-sync"]},{product:"Web Audio AnalyserNode visualisers",maker:"W3C Web Audio API (MDN guide)",era:"2013-",form:"other",look:"The browser's built-in analyser gives time-domain samples for oscilloscope lines and frequency bins for bar graphs, read on every requestAnimationFrame.",states:"Works on any source: microphone stream, an audio element, or the reply player's output.",drivenBy:"Stated: fftSize (default 2048) gives frequencyBinCount = fftSize/2 bins; getByte/FloatTimeDomainData for the wave, getByte/FloatFrequencyData for the spectrum; smoothingTimeConstant and min/maxDecibels shape the response. MDN uses fftSize 256 for readable bars.",takeaway:"Everything abstract designs need (wave, spectrum, loudness) is free in the browser with no server. Use log-spaced band grouping, since raw bins put most voice energy in the first few bins.",sources:["https://developer.mozilla.org/en-US/docs/Web/API/Web_Audio_API/Visualizations_with_Web_Audio_API"]},{product:"Browser pitch detection (pitchy, McLeod pitch method)",maker:"pitchy (open source)",era:"Current",form:"other",look:"A small JavaScript library that takes a time-domain buffer and returns the fundamental frequency in Hz and a clarity value from 0 to 1.",states:"Clarity near 1 on vowels, low on whispers and fricatives, so it doubles as a voicing detector.",drivenBy:"Stated: McLeod Pitch Method (McLeod and Wyvill, 'A Smarter Way to Find Pitch'); runs in Node and the browser on buffers from an AnalyserNode or AudioWorklet.",takeaway:"Pitch and its slope (rising for questions) are cheap to get in the browser and are the signal Meta's ring and the Rapport Agent use beyond loudness. Clarity gates out noisy guesses.",sources:["https://github.com/ianprime0509/pitchy"]},{product:"TTS viseme events (Azure Speech, Amazon Polly)",maker:"Microsoft, Amazon",era:"Current",form:"other",look:"Cloud TTS that returns mouth data alongside the audio. Azure: 22 viseme IDs with audio offsets, or 55 ARKit-style blend shapes per frame at 60 fps, or SVG mouth animations for en-US. Polly: speech marks as JSON lines for sentence, word, viseme and SSML events with times in milliseconds.",states:"Speaking only; the events cover the assistant's own voice.",drivenBy:"Stated: Azure delivers VisemeReceived events with offsets in 100 ns ticks; blend-shape frames must be rendered just before the matching audio chunk. Polly returns speech marks instead of audio, so a second request is needed for the sound.",takeaway:"Server-side viseme timing is exact but ties you to a vendor and a second stream; it is the upgrade path for a face, not a requirement. Word timings are also enough to pulse on each word.",sources:["https://learn.microsoft.com/en-us/azure/ai-services/speech-service/how-to-speech-synthesis-viseme","https://docs.aws.amazon.com/polly/latest/dg/speechmarks.html","https://docs.aws.amazon.com/polly/latest/dg/viseme.html"]},{product:"ElevenLabs character timestamps",maker:"ElevenLabs",era:"Current",form:"other",look:"TTS responses that include per-character timing: characters with start and end times in seconds (HTTP), or chars, charStartTimesMs and charDurationsMs per audio chunk (WebSocket).",states:"Speaking only.",drivenBy:"Stated: alignment and normalized_alignment arrays of equal length; on the WebSocket the times are relative to each returned chunk.",takeaway:"Character timing gives word and syllable onsets for free; mapping letters to rough mouth shapes is crude but cheap. Useful for pulsing on words or highlighting a live caption.",sources:["https://elevenlabs.io/docs/api-reference/text-to-speech/convert-with-timestamps","https://elevenlabs.io/docs/api-reference/text-to-speech/v-1-text-to-speech-voice-id-stream-input"]},{product:"Local TTS phoneme output (Piper, Kokoro)",maker:"Open Home Foundation (Piper), hexgrad (Kokoro)",era:"Current",form:"other",look:"Local neural TTS engines that already compute phonemes. Piper (espeak-ng phonemes) can expose per-phoneme sample counts; Kokoro (misaki G2P) yields graphemes and phonemes with each audio chunk.",states:"Speaking only.",drivenBy:"Stated: Piper's experimental alignments give phonemes, phoneme_ids and phoneme_id_samples per AudioChunk after patching the voice model. Kokoro's pipeline yields (graphemes, phonemes, audio) at 24 kHz; its README shows no per-phoneme timestamps.",takeaway:"A local server could send exact phoneme timing with Piper at almost no cost, which maps directly to visemes. With Kokoro you get the phoneme string but would have to estimate timing.",sources:["https://raw.githubusercontent.com/OHF-Voice/piper1-gpl/main/docs/ALIGNMENTS.md","https://github.com/hexgrad/kokoro"]},{product:"Light behaviours in smart speakers (user study)",maker:"Kunchay and Abdullah, ACM CUI 2021",era:"2021",form:"other",look:"A survey of 1,006 smart speaker users in seven countries on whether they could tell what Echo and Google Home light patterns meant, plus interviews with six experts.",states:"Covers all device light states, including listening, thinking and notifications.",drivenBy:"Stated: on average users identified only about 37% of light behaviours correctly; Echo users did better than Google Home users.",takeaway:"Abstract light patterns are mostly not understood. Keep the number of states small, make each one very different, and back state with sound or words.",sources:["https://pure.psu.edu/en/publications/assessing-effectiveness-and-interpretability-of-light-behaviors-i/"]},{product:"Rapport Agent (contingent listener feedback)",maker:"Gratch et al., USC Institute for Creative Technologies",era:"2006-2010",form:"avatar",look:"A virtual human listener that nods, mirrors posture and shifts gaze while a person tells it a story, without facial expressions.",states:"Listening only: backchannel nods at prosodic cues, mimicry of head nods and gaze shifts.",drivenBy:"Stated: real-time analysis of speech acoustics (backchannel opportunity points, disfluencies, questions, loudness) and speaker head motion. The 2007 study found contingent feedback mattered: the responsive agent matched human listeners for rapport, while the same nods at random times did worse.",takeaway:"Timing beats amount: a nod placed at a pause or pitch drop builds rapport, the same nod at a random moment does not. A listening visual should react to the person's pauses and pitch, not loop.",sources:["https://people.ict.usc.edu/gratch/public_html/GratchIVA07-rapport.pdf"]},{product:"The uncanny valley",maker:"Masahiro Mori (1970), IEEE Spectrum translation",era:"1970 (translated 2012)",form:"other",look:"Mori's curve: affinity rises as a robot looks more human, falls sharply just before full human likeness, then rises again.",states:"Movement makes it worse: Mori says motion amplifies both the peaks and the valley.",drivenBy:"Stated: Mori recommends designers aim for the first peak (moderate human likeness, high affinity) rather than near-perfect realism.",takeaway:"Faces should be clearly stylised (eyes only, a blob, a cartoon mouth), and the closer to human they get, the more exact the lip sync must be. Animated faces fail faster than still ones.",sources:["https://spectrum.ieee.org/the-uncanny-valley"]},{product:"WCAG 2.3.3 Animation from Interactions",maker:"W3C",era:"WCAG 2.1 (2018) onward",form:"other",look:"A AAA criterion: motion animation triggered by interaction can be disabled unless essential. The intent cites vestibular reactions such as dizziness, nausea and headaches.",states:"Applies to every animated state; the technique is to honour the operating system's reduce-motion setting (prefers-reduced-motion).",drivenBy:"Stated: users should be able to prevent non-essential motion; sites should use the user agent or OS reduce-motion feature.",takeaway:"Under reduced motion, state must still read from colour, shape and size changes without continuous movement. Audio-reactive motion counts as motion.",sources:["https://www.w3.org/WAI/WCAG22/Understanding/animation-from-interactions.html"]}],Ko=gc;var ni=[],Ut=(n,e)=>{try{ni.push({file:n,module:e()})}catch(t){ni.push({file:n,error:"Load failed: "+(t&&t.message?t.message:String(t))})}};Ut("aurora-ribbons",()=>(Ra(),Kt(Fa)));Ut("blob-buddy",()=>(Va(),Kt(Ba)));Ut("chladni-sand",()=>(ja(),Kt(Ua)));Ut("cloud-orb",()=>(Qa(),Kt(Za)));Ut("dot-matrix",()=>(nr(),Kt(tr)));Ut("dot-quartet",()=>(or(),Kt(sr)));Ut("edge-glow",()=>(cr(),Kt(lr)));Ut("flame",()=>(pr()
